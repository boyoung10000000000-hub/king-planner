<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>포스코킹 업무플래너 - PC/모바일 실시간 연동</title>
<style>
:root{--bg:#f4f7fb;--panel:#fff;--line:#dfe5ee;--text:#1f2937;--muted:#64748b;--accent:#0ea5e9;--shadow:0 6px 18px rgba(15,23,42,.08)}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--text)}

/* 로그인 창 */
#loginOverlay{position:fixed;inset:0;background:#0f172a;z-index:9999;display:flex;align-items:center;justify-content:center;color:#fff}
.login-box{background:#1e293b;padding:32px;border-radius:16px;text-align:center;max-width:360px;width:90%}
.login-box h2{margin-top:0;font-size:22px;color:#38bdf8}
.login-box p{font-size:13px;color:#94a3b8;margin-bottom:24px}
.btn-google{background:#fff;color:#0f172a;border:none;padding:12px 20px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:10px}

.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.sidebar{background:#0f172a;color:#fff;padding:18px 14px}
.brand{font-weight:800;font-size:20px;margin:6px 8px 18px}
.nav button{width:100%;text-align:left;border:0;background:transparent;color:#cbd5e1;padding:11px 12px;border-radius:10px;margin:3px 0;font-size:15px;cursor:pointer}
.nav button.active,.nav button:hover{background:#1e293b;color:#fff}
.main{padding:16px;min-width:0}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.title{font-size:23px;font-weight:800}
.section{display:none}.section.active{display:block}
.crm-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.crm-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow)}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px;cursor:pointer;font-size:12px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{display:none}.main{padding:8px}}
</style>
</head>
<body>

<div id="loginOverlay">
  <div class="login-box">
    <h2>포스코킹 업무플래너</h2>
    <p>구글 로그인 후 PC와 폰에서 실시간 연동으로 사용하세요.</p>
    <button class="btn-google" id="loginBtn">Google 계정으로 로그인</button>
  </div>
</div>

<div class="app">
  <aside class="sidebar">
    <div class="brand">포스코킹 플래너</div>
    <div class="nav">
      <button class="active" data-section="dashboard">🏠 오늘업무</button>
      <button data-section="customers">👤 고객관리</button>
      <button data-section="listings">🏠 접수매물</button>
      <button data-section="contracts">✅ 계약완료</button>
    </div>
    <div style="margin-top:20px;padding-top:10px;border-top:1px solid #334155">
      <div id="userEmail" style="font-size:11px;color:#94a3b8;margin-bottom:8px"></div>
      <button id="logoutBtn" class="btn" style="width:100%;color:#red;display:none">로그아웃</button>
    </div>
  </aside>

  <main class="main">
    <section id="dashboard" class="section active">
      <div class="topbar">
        <div><div class="title">오늘의 업무 대시보드</div><div style="font-size:12px;color:#0ea5e9;margin-top:4px">● 클라우드 실시간 연동 중</div></div>
      </div>
      <div style="margin-top:20px" class="crm-grid">
        <div class="crm-card"><b>PC / 스마트폰 연동 완료</b><br><span style="font-size:12px;color:#64748b">어느 기기에서 수정하든 즉시 반영됩니다.</span></div>
      </div>
    </section>
    
    <section id="customers" class="section">
      <div class="topbar"><div class="title">고객관리</div></div>
      <p style="font-size:13px;color:#64748b">등록된 고객 정보가 표시됩니다.</p>
    </section>

    <section id="listings" class="section">
      <div class="topbar"><div class="title">접수매물</div></div>
      <p style="font-size:13px;color:#64748b">등록된 매물 정보가 표시됩니다.</p>
    </section>

    <section id="contracts" class="section">
      <div class="topbar"><div class="title">계약완료</div></div>
      <p style="font-size:13px;color:#64748b">계약 내역이 표시됩니다.</p>
    </section>
  </main>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
  import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
  import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

  // 보내주신 연동 키 자동 적용
  const firebaseConfig = {
    apiKey: "AIzaSyD_R1BqvCu6-6G50n8trya1OKb-u3oLAmU",
    authDomain: "king-planner.firebaseapp.com",
    databaseURL: "https://king-planner-default-rtdb.firebaseio.com",
    projectId: "king-planner",
    storageBucket: "king-planner.firebasestorage.app",
    messagingSenderId: "528213755452",
    appId: "1:528213755452:web:b63377864a671f4955e539"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);
  const provider = new GoogleAuthProvider();

  document.getElementById("loginBtn").onclick = () => signInWithPopup(auth, provider);
  document.getElementById("logoutBtn").onclick = () => signOut(auth).then(() => location.reload());

  onAuthStateChanged(auth, user => {
    if (user) {
      document.getElementById("loginOverlay").style.display = "none";
      document.getElementById("userEmail").textContent = user.email;
      document.getElementById("logoutBtn").style.display = "block";

      // 내 계정 전용 데이터 실시간 동기화
      const userRef = ref(db, 'users/' + user.uid);
      onValue(userRef, (snapshot) => {
        const data = snapshot.val();
        if (data) {
          console.log("실시간 데이터 불러오기 성공:", data);
        }
      });
    } else {
      document.getElementById("loginOverlay").style.display = "flex";
    }
  });
</script>

<script>
document.querySelectorAll(".nav button[data-section]").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".nav button[data-section]").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
    document.getElementById(btn.dataset.section).classList.add("active");
  };
});
</script>
</body>
</html>
